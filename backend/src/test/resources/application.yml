# 테스트 전용 설정: PostgreSQL 대신 H2 메모리 DB(PostgreSQL 호환 모드)를 쓴다
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;LOCK_TIMEOUT=30000
    username: sa
    password:
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_batch_fetch_size: 100

logging:
  level:
    org.hibernate.SQL: info

# 테스트 전용 값 (실제 서버는 환경변수 JWT_SECRET 을 쓴다)
jwt:
  secret: test-only-jwt-secret-for-unit-tests-0123456789
  expiration-seconds: 3600

# 테스트는 각자 데이터를 만든다 (샘플 주문은 SampleOrderInitializerTest 에서만 따로 확인)
app:
  sample-data:
    enabled: false
