spring:
  application:
    name: backend

  # backend/.env 파일이 있으면 그 안의 환경변수(DB_PASSWORD 등)를 읽는다 (없으면 무시). .env 는 git 에 올라가지 않는다
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/logistics
    username: postgres
    password: ${DB_PASSWORD}

  # 상품 이미지 업로드: 파일 하나 5MB 까지 (넘으면 413 IMAGE_TOO_LARGE)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  jpa:
    hibernate:
      ddl-auto: update # 개발용: 엔티티에 맞춰 테이블을 자동 생성/수정
    properties:
      hibernate:
        format_sql: true # SQL을 줄바꿈해서 읽기 좋게 출력
        default_batch_fetch_size: 100 # 연관 데이터(주문 상품 등)를 1건씩이 아니라 최대 100건씩 묶어서(IN 쿼리) 가져온다 → N+1 완화

logging:
  level:
    org.hibernate.SQL: debug # 실행되는 SQL을 로그로 출력

# 비밀값은 모두 환경변수로 받는다 (backend/.env.example 참고)
jwt:
  secret: ${JWT_SECRET}          # 32자 이상의 임의 문자열
  expiration-seconds: 86400      # 로그인 토큰 유효 시간 (24시간)

app:
  admin:
    email: ${ADMIN_EMAIL:}       # 비어 있으면 관리자 계정을 만들지 않는다
    password: ${ADMIN_PASSWORD:}
  sample-data:
    enabled: true                # orders 가 비어 있으면 샘플 주문·배송 데이터를 넣는다
  upload:
    dir: uploads                 # 상품 이미지 저장 폴더 (backend/uploads, git 에 올리지 않는다). /uploads/** 주소로 제공
